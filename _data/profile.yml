short_bio: >-
  <p>I am an MPhil student in Computational Media and Arts at the Hong Kong University of Science and Technology (Guangzhou), advised by Prof. Mingming Fan and Prof. Chen Liang. I previously studied Data Journalism at the Communication University of China.</p>
  <p>My research interests span human–AI interaction and human–robot interaction. I study how people interpret and respond to intelligent systems in social contexts, and how those systems may shape human understanding, behavior, and decisions. I combine human-centered studies with computational methods and interactive prototypes.</p>
  <h5>Current research</h5>
  <p><strong>Human–AI interaction.</strong> In ContextInk, I study how free-form annotations can remain useful as readers’ questions evolve. I am also interested in how AI-mediated information and sustained interaction with AI may affect people’s thinking and choices.</p>
  <p><strong>Human–robot interaction.</strong> My MPhil project studies collaboration with a soft floating robot in indoor inspection tasks. More broadly, I am interested in how embodied robots enter shared spaces and existing social relationships, and how context and cultural expectations shape those encounters.</p>
  <p><strong>Context-aware interaction.</strong> I have worked on a survey of wake-up systems and on models of interaction intent, examining how systems decide when and how to engage with people.</p>

